<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vélstjórn C til D</title>
  <meta name="description" content="Eight-term study plan from haustonn 2026 to velfraedingur (STCW A-III/2) at Taekniskolinn - Veltaekniskolinn, VC25 to VD25.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <meta property="og:title" content="Vélstjórn C til D">
  <meta property="og:description" content="Eight-term study plan from haustonn 2026 to velfraedingur (STCW A-III/2) at Taekniskolinn - Veltaekniskolinn, VC25 to VD25.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; }
    img, svg { max-width: 100%; height: auto; }
    :where(a) { color: inherit; }
    :where(:focus-visible) { outline: 2px solid currentColor; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
    }
  </style>
<style>
:root {
  --ground:      #F4F5F3;
  --surface:     #FFFFFF;
  --surface-alt: #EAEDEA;
  --ink:         #16201F;
  --ink-soft:    #4A5654;
  --ink-faint:   #79847F;
  --line:        #D6DBD7;
  --line-strong: #B4BCB8;
  --accent:      #BE4715;
  --accent-ink:  #8F350F;
  --accent-wash: #F6E4DA;
  --deep:        #1E3A38;
  --deep-ink:    #FFFFFF;
  --good:        #2C6A4E;
  --good-wash:   #DFEDE4;

  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:    "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #101615;
    --surface:     #18211F;
    --surface-alt: #1E2826;
    --ink:         #E7EBE8;
    --ink-soft:    #A5AFAB;
    --ink-faint:   #78837F;
    --line:        #2A3634;
    --line-strong: #3B4A47;
    --accent:      #E87641;
    --accent-ink:  #F0906A;
    --accent-wash: #351F16;
    --deep:        #9DC3BC;
    --deep-ink:    #0E1615;
    --good:        #74C39A;
    --good-wash:   #16281F;
  }
}

:root[data-theme="dark"] {
  --ground:      #101615;
  --surface:     #18211F;
  --surface-alt: #1E2826;
  --ink:         #E7EBE8;
  --ink-soft:    #A5AFAB;
  --ink-faint:   #78837F;
  --line:        #2A3634;
  --line-strong: #3B4A47;
  --accent:      #E87641;
  --accent-ink:  #F0906A;
  --accent-wash: #351F16;
  --deep:        #9DC3BC;
  --deep-ink:    #0E1615;
  --good:        #74C39A;
  --good-wash:   #16281F;
}

* { box-sizing: border-box; }

body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
  margin: 0;
  padding: 0 24px 96px;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1080px; margin: 0 auto; }

/* ---------- masthead ---------- */

.mast {
  padding: 72px 0 40px;
  border-bottom: 2px solid var(--ink);
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.eyebrow {
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin: 0;
}
h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(38px, 6.5vw, 68px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  text-wrap: balance;
  margin: 0;
}
.standfirst {
  font-size: 20px;
  line-height: 1.5;
  color: var(--ink-soft);
  max-width: 62ch;
  margin: 0;
}

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin: 40px 0 0;
}
.fact { background: var(--surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.fact dt {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0;
}
.fact dd {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: -0.015em;
  margin: 0;
  font-variant-numeric: tabular-nums;
}

/* ---------- sections ---------- */

section { margin: 72px 0 0; }

h2 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink);
  margin: 0 0 8px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line-strong);
}
.sec-lede {
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink-soft);
  max-width: 66ch;
  margin: 20px 0 0;
}
.sec-lede strong { color: var(--ink); font-weight: 600; }

/* ---------- chains ---------- */

.chains { display: flex; flex-direction: column; gap: 4px; margin: 32px 0 0; }
.chain {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.chain-name {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  min-width: 96px;
}
.chain-links {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  font-family: var(--f-mono);
  font-size: 12.5px;
}
.lk {
  background: var(--surface-alt);
  border: 1px solid var(--line);
  padding: 4px 8px;
  white-space: nowrap;
}
.lk.locked { border-color: var(--accent); color: var(--accent-ink); }
.arrow { color: var(--line-strong); font-size: 13px; }
.chain-note {
  font-family: var(--f-mono);
  font-size: 11.5px;
  color: var(--ink-faint);
  margin-left: auto;
  white-space: nowrap;
}

/* ---------- term spine ---------- */

.spine { margin: 32px 0 0; display: flex; flex-direction: column; gap: 3px; }

.term {
  display: grid;
  grid-template-columns: 190px 1fr;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-strong);
}
.term.now    { border-left-color: var(--accent); }
.term.crit   { border-left-color: var(--accent); }
.term.dlevel { border-left-color: var(--deep); }

.term-rail {
  padding: 22px 20px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.term-no {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.term-name {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.term-ein {
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.tag {
  font-family: var(--f-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 7px;
  align-self: flex-start;
  border: 1px solid currentColor;
}
.tag.hot  { color: var(--accent-ink); background: var(--accent-wash); }
.tag.cool { color: var(--deep); }

.courses { padding: 14px 0; display: flex; flex-direction: column; }
.course {
  display: grid;
  grid-template-columns: 148px 1fr auto auto;
  gap: 14px;
  align-items: baseline;
  padding: 6px 20px;
}
.course + .course { border-top: 1px solid var(--line); }
.code {
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.course.add .code { color: var(--accent-ink); font-weight: 600; }
.title-is { font-size: 16px; color: var(--ink-soft); }
.meta {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  text-align: right;
  white-space: nowrap;
}
.meta.warn { color: var(--accent-ink); font-weight: 600; }
.ein {
  font-family: var(--f-mono);
  font-size: 13px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  text-align: right;
  min-width: 18px;
}

/* ---------- milestone band ---------- */

.milestone {
  background: var(--deep);
  color: var(--deep-ink);
  padding: 16px 22px;
  display: flex;
  align-items: baseline;
  gap: 18px;
  flex-wrap: wrap;
}
.ms-mark {
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.72;
}
.ms-text {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.01em;
}
.ms-why {
  font-family: var(--f-mono);
  font-size: 11.5px;
  opacity: 0.72;
  margin-left: auto;
}

/* ---------- tables ---------- */

.scroll { overflow-x: auto; margin: 28px 0 0; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; background: var(--surface); font-size: 15px; }
th {
  font-family: var(--f-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  text-align: left;
  padding: 13px 18px;
  border-bottom: 1px solid var(--line-strong);
  white-space: nowrap;
}
td { padding: 13px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.term-cell { font-family: var(--f-display); font-weight: 600; white-space: nowrap; }
td.mono { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-soft); }

/* ---------- load bars ---------- */

.load { display: flex; flex-direction: column; gap: 2px; margin: 28px 0 0; }
.load-row {
  display: grid;
  grid-template-columns: 132px 1fr 58px;
  gap: 16px;
  align-items: center;
  padding: 7px 0;
}
.load-label { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); }
.load-track { background: var(--surface-alt); height: 20px; position: relative; border: 1px solid var(--line); }
.load-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.load-fill.past { background: var(--line-strong); }
.load-val {
  font-family: var(--f-mono);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--ink-soft);
}

/* ---------- checklist ---------- */

ol.checks { list-style: none; counter-reset: c; padding: 0; margin: 28px 0 0; display: flex; flex-direction: column; gap: 3px; }
ol.checks li {
  counter-increment: c;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 16px 20px 16px 56px;
  position: relative;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink-soft);
}
ol.checks li::before {
  content: counter(c, decimal-leading-zero);
  position: absolute;
  left: 20px;
  top: 16px;
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-ink);
}
ol.checks strong { color: var(--ink); font-weight: 600; }
ol.checks code, p code, li code {
  font-family: var(--f-mono);
  font-size: 0.88em;
  background: var(--surface-alt);
  padding: 1px 5px;
  border: 1px solid var(--line);
}

ul.plain { list-style: none; padding: 0; margin: 28px 0 0; display: flex; flex-direction: column; gap: 3px; }
ul.plain li {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--good);
  padding: 16px 20px;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink-soft);
}
ul.plain strong { color: var(--ink); font-weight: 600; }

.callout {
  background: var(--accent-wash);
  border: 1px solid var(--accent);
  padding: 20px 22px;
  margin: 28px 0 0;
  font-size: 16.5px;
  line-height: 1.55;
  color: var(--ink);
}
.callout strong { font-weight: 600; }

footer {
  margin: 80px 0 0;
  padding-top: 24px;
  border-top: 1px solid var(--line-strong);
  font-family: var(--f-mono);
  font-size: 11.5px;
  color: var(--ink-faint);
  line-height: 1.7;
}

@media (max-width: 720px) {
  body { padding: 0 16px 64px; font-size: 16px; }
  .term { grid-template-columns: 1fr; }
  .term-rail { border-right: none; border-bottom: 1px solid var(--line); flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 12px; }
  .course { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .course .title-is { grid-column: 1 / -1; }
  .meta { text-align: left; grid-column: 1 / -1; }
  .load-row { grid-template-columns: 96px 1fr 48px; }
  .chain-note { margin-left: 0; }
}

/* ---------- gated states ---------- */
.state {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  max-width: 54ch;
}
.state-title {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(24px, 4vw, 34px);
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.state-detail { font-size: 18px; line-height: 1.55; color: var(--ink-soft); margin: 0; }
.state.locked  .state-title { color: var(--ink); }
.state.error   .state-title { color: var(--accent-ink); }
.state.loading .state-title { color: var(--ink-faint); }
.state code {
  font-family: var(--f-mono); font-size: 0.88em;
  background: var(--surface-alt); padding: 1px 5px; border: 1px solid var(--line);
}
.muted { color: var(--ink-faint); font-weight: 500; }
noscript p {
  max-width: 54ch; margin: 25vh 0 0;
  font-size: 18px; line-height: 1.55; color: var(--ink-soft);
}
</style>

</head>
<body>

<div class="wrap" id="app">
  <div class="state loading">
    <p class="state-title">Unlocking…</p>
  </div>
</div>

<noscript>
  <div class="wrap">
    <p>This plan is stored encrypted and is decrypted in the browser, so JavaScript has to be
    enabled to read it.</p>
  </div>
</noscript>

<script src="app.js"></script>
</body>
</html>
